<div id="rf-gd88-profiles" data-color-mode="Day">
  <div class="viz-dotted-background rf-preview">
    <div class="rf-display" aria-label="GD-88 display preview">
      <div class="rf-status">
        <span class="rf-status-left">
          <span class="rf-mode-roaming">
            <span class="rf-mode-signal">
              <span class="rf-receive-bars" role="img" aria-label="Signal strength: 3 of 4 bars">
                <b data-lit></b><b data-lit></b><b data-lit></b><b></b>
              </span>
              <span class="rf-status-icon" data-icon="fm" role="img" aria-label="Analog FM" hidden><span class="rf-mode-mark" aria-hidden="true">FM</span></span>
              <span class="rf-status-icon" data-icon="dmr" role="img" aria-label="DMR"><span class="rf-mode-mark" aria-hidden="true">DMR</span></span>
              <span class="rf-status-icon" data-icon="p25" role="img" aria-label="P25" hidden><span class="rf-mode-mark" aria-hidden="true">P25</span></span>
              <span class="rf-status-icon" data-icon="nxdn" role="img" aria-label="NXDN" hidden><span class="rf-mode-mark" aria-hidden="true">NXDN</span></span>
              <span class="rf-status-icon" data-icon="dstar" role="img" aria-label="D-STAR" hidden><span class="rf-mode-mark" aria-hidden="true">D-STAR</span></span>
            </span>
            <span class="rf-status-icon" data-icon="roam" role="img" aria-label="Roaming" hidden><span class="rf-roam" aria-hidden="true"><span class="rf-roam-orbit"><i data-lucide="rotate-cw" aria-hidden="true">⟳</i></span><span class="rf-roam-tower"><i data-lucide="radio-tower" aria-hidden="true">↟</i></span></span></span>
          </span>
          <span class="rf-status-info">
            <span data-radio-state></span>
            <span class="rf-status-functions">
              <span data-feature="monitor" role="img" aria-label="Monitor active" hidden><i data-lucide="ear" aria-hidden="true">◖</i></span>
              <span data-feature="dual" role="img" aria-label="Dual watch" hidden><span class="rf-dual-lens" aria-hidden="true"><span class="rf-lens-circle"><b>AB</b></span></span></span>
              <span data-feature="vox" role="img" aria-label="VOX armed" hidden><span class="rf-vox-mark" aria-hidden="true"><b>V</b><b>O</b><b>X</b></span></span>
            </span>
          </span>
        </span>
        <span class="rf-indicators">
          <span class="rf-status-icon" data-icon="scan" role="img" aria-label="Scanning" hidden><i class="rf-zigzag" aria-hidden="true"><b></b><b></b><b></b><b></b></i></span>
          <span class="rf-status-icon" data-icon="talkaround" role="img" aria-label="Talkaround" hidden><i class="rf-talkaround" aria-hidden="true"><b></b></i></span>
          <span class="rf-status-icon" data-icon="clear" role="img" aria-label="Encryption clear"><span class="rf-key" data-encryption-state="clear" aria-hidden="true"><i data-lucide="key-round" aria-hidden="true">⚿</i></span></span>
          <span class="rf-status-icon" data-icon="arc4" role="img" aria-label="ARC4 encryption" hidden><span class="rf-key" data-encryption-state="ARC4" aria-hidden="true"><i data-lucide="key-round" aria-hidden="true">⚿</i><b>ARC4</b></span></span>
          <span class="rf-status-icon" data-icon="aes" role="img" aria-label="AES encryption" hidden><span class="rf-key" data-encryption-state="AES" aria-hidden="true"><i data-lucide="key-round" aria-hidden="true">⚿</i><b>AES</b></span></span>
          <span class="rf-status-icon" data-icon="messages" role="img" aria-label="Unread messages" hidden><i class="rf-envelope" aria-hidden="true"><b></b></i></span>
          <span class="rf-status-icon" data-icon="recording" role="img" aria-label="Recording active" hidden><span class="rf-record-mark" aria-hidden="true"><i data-lucide="square" aria-hidden="true">□</i></span></span>
          <span class="rf-status-icon" data-icon="fix" role="img" aria-label="Valid GPS fix" hidden><i data-lucide="map-pin" aria-hidden="true">◇</i></span>
          <span class="rf-status-icon" data-icon="locked" role="img" aria-label="Keypad locked" hidden><i data-lucide="lock-keyhole" aria-hidden="true">▣</i></span>
          <span class="rf-status-icon" data-icon="power" role="img" aria-label="Low power"><b aria-hidden="true">L</b></span>
          <span class="rf-status-icon" data-icon="bluetooth" role="img" aria-label="Bluetooth off" data-bt-state="off" hidden><i data-lucide="bluetooth" aria-hidden="true">ᛒ</i></span>
          <span class="rf-status-icon" data-icon="battery" role="img" aria-label="Battery level"><i class="rf-battery" aria-hidden="true"><b></b><b></b><b></b></i></span>
        </span>
      </div>
      <section class="rf-home" data-screen="home" aria-label="Home" aria-live="polite">
        <div class="rf-home-status" aria-label="Active radio features">
          <span data-feature="rx-only" role="img" aria-label="Receive-only channel" hidden><span class="rf-rx-only-mark" aria-hidden="true"><b>TX</b></span></span>
        </div>
        <div class="rf-zone">Local repeaters</div>
        <div class="rf-group">USA Nationwide</div>
        <div class="rf-details" data-amateur hidden>
          <div>County repeater<span data-dmr-details> · TG 3100</span></div>
          <div>444.625 MHz<span data-dmr-details> · TS1 · CC1</span></div>
        </div>
        <div class="rf-caller" data-caller hidden></div>
      </section>
      <section class="rf-menu" data-screen="menu" aria-label="Menu" hidden>
        <h2>Menu</h2>
        <button type="button" data-go="settings">Settings <span aria-hidden="true">›</span></button>
      </section>
      <section class="rf-menu" data-screen="settings" aria-label="Settings" hidden>
        <h2>Settings</h2>
        <button type="button" data-go="display">Display <span aria-hidden="true">›</span></button>
      </section>
      <section class="rf-menu" data-screen="display" aria-label="Display" hidden>
        <h2>Display</h2>
        <button type="button" data-go="profiles">Display Profile <span data-current>Commercial</span></button>
        <button type="button" data-go="color-mode">Day/Night <span data-current-mode>Day</span></button>
        <button type="button" data-go="gps-clock">GPS clock <span data-current-clock>Off</span></button>
      </section>
      <section class="rf-menu" data-screen="profiles" aria-label="Display Profile" hidden>
        <h2>Display Profile</h2>
        <button type="button" data-profile="Commercial" aria-pressed="true">Commercial <span aria-hidden="true">✓</span></button>
        <button type="button" data-profile="Amateur" aria-pressed="false">Amateur <span aria-hidden="true"></span></button>
      </section>
      <section class="rf-menu" data-screen="color-mode" aria-label="Day/Night" hidden>
        <h2>Day/Night</h2>
        <button type="button" data-mode="Day" aria-pressed="true">Day <span aria-hidden="true">✓</span></button>
        <button type="button" data-mode="Night" aria-pressed="false">Night <span aria-hidden="true"></span></button>
      </section>
      <section class="rf-menu" data-screen="gps-clock" aria-label="GPS clock" hidden>
        <h2>GPS clock</h2>
        <button type="button" data-clock="off" aria-pressed="true">Off <span aria-hidden="true">✓</span></button>
        <button type="button" data-clock="on" aria-pressed="false">On <span aria-hidden="true"></span></button>
      </section>
      <div class="rf-keybar">
        <button type="button" data-go="menu" data-home-key>OK Menu</button>
        <span data-home-key>* Quick</span>
        <button type="button" data-back hidden>Back</button>
      </div>
    </div>
  </div>
  <div class="viz-controls rf-controls">
    <label class="form-label">Simulated radio activity
      <select class="form-select" data-activity>
        <option value="idle">Standby</option>
        <option value="alias">Receiving with alias</option>
        <option value="rx">Receiving without alias</option>
        <option value="tx">Transmitting</option>
        <option value="aprs">Transmitting APRS</option>
        <option value="denied">Transmit denied</option>
      </select>
    </label>
  </div>
  <fieldset class="rf-legend">
    <legend>Status icons</legend>
    <div class="rf-legend-grid">
      <label class="rf-legend-row rf-legend-choice rf-mode-choice">
        <span>Radio mode</span>
        <select class="form-select" aria-label="Radio mode" data-select="radio-mode"><option value="fm">Analog FM</option><option value="dmr" selected>DMR</option><option value="p25">P25</option><option value="nxdn">NXDN</option><option value="dstar">D-STAR</option></select>
        <span class="rf-legend-glyphs"><span class="rf-legend-icon" role="img" aria-label="Analog FM"><span class="rf-mode-mark" aria-hidden="true">FM</span></span><span class="rf-legend-icon" role="img" aria-label="DMR"><span class="rf-mode-mark" aria-hidden="true">DMR</span></span><span class="rf-legend-icon" role="img" aria-label="P25"><span class="rf-mode-mark" aria-hidden="true">P25</span></span><span class="rf-legend-icon" role="img" aria-label="NXDN"><span class="rf-mode-mark" aria-hidden="true">NXDN</span></span><span class="rf-legend-icon" role="img" aria-label="D-STAR"><span class="rf-mode-mark" aria-hidden="true">D-STAR</span></span></span>
      </label>
      <label class="rf-legend-row rf-legend-choice">
        <span>Signal strength</span>
        <select class="form-select" data-select="signal">
          <option value="0">No signal</option><option value="1">1 bar</option><option value="2">2 bars</option>
          <option value="3" selected>3 bars</option><option value="4">4 bars</option>
        </select>
      </label>
      <label class="rf-legend-row form-check form-switch">
        <input class="form-check-input" type="checkbox" data-toggle="scan">
        <span>Scan</span>
        <span class="rf-legend-glyphs"><span class="rf-legend-icon" role="img" aria-label="Scanning"><i class="rf-zigzag" aria-hidden="true"><b></b><b></b><b></b><b></b></i></span></span>
      </label>
      <label class="rf-legend-row form-check form-switch">
        <input class="form-check-input" type="checkbox" data-toggle="monitor">
        <span>Monitor</span>
        <span class="rf-legend-glyphs"><span class="rf-legend-icon" role="img" aria-label="Monitor"><i data-lucide="ear" aria-hidden="true">◖</i></span><small>DMon / MON</small></span>
      </label>
      <label class="rf-legend-row form-check form-switch">
        <input class="form-check-input" type="checkbox" data-toggle="dual">
        <span>Dual watch</span>
        <span class="rf-legend-glyphs"><span class="rf-legend-icon rf-dual-legend" role="img" aria-label="Dual watch"><span class="rf-dual-lens" aria-hidden="true"><span class="rf-lens-circle"><b>AB</b></span></span></span></span>
      </label>
      <label class="rf-legend-row form-check form-switch">
        <input class="form-check-input" type="checkbox" data-toggle="vox">
        <span>VOX armed</span>
        <span class="rf-legend-glyphs"><span class="rf-legend-icon rf-vox-legend" role="img" aria-label="VOX armed"><span class="rf-vox-mark" aria-hidden="true"><b>V</b><b>O</b><b>X</b></span></span></span>
      </label>
      <label class="rf-legend-row form-check form-switch">
        <input class="form-check-input" type="checkbox" data-toggle="rx-only">
        <span>Receive-only channel</span>
        <span class="rf-legend-glyphs"><span class="rf-legend-icon rf-rx-only-legend" role="img" aria-label="Receive-only channel"><span class="rf-rx-only-mark" aria-hidden="true"><b>TX</b></span></span></span>
      </label>
      <label class="rf-legend-row form-check form-switch">
        <input class="form-check-input" type="checkbox" data-toggle="talkaround">
        <span>Talkaround</span>
        <span class="rf-legend-glyphs"><span class="rf-legend-icon" role="img" aria-label="Talkaround"><i class="rf-talkaround" aria-hidden="true"><b></b></i></span></span>
      </label>
      <label class="rf-legend-row form-check form-switch">
        <input class="form-check-input" type="checkbox" data-toggle="roam">
        <span>Roaming</span>
        <span class="rf-legend-glyphs"><span class="rf-legend-icon" role="img" aria-label="Roaming"><span class="rf-roam" aria-hidden="true"><span class="rf-roam-orbit"><i data-lucide="rotate-cw" aria-hidden="true">⟳</i></span><span class="rf-roam-tower"><i data-lucide="radio-tower" aria-hidden="true">↟</i></span></span></span></span>
      </label>
      <label class="rf-legend-row rf-legend-choice">
        <span>Encryption</span>
        <select class="form-select" aria-label="Encryption" data-select="encryption"><option value="clear">Clear</option><option value="arc4">ARC4</option><option value="aes">AES</option></select>
        <span class="rf-legend-glyphs"><span class="rf-legend-icon" role="img" aria-label="Encryption clear"><span class="rf-key" data-encryption-state="clear" aria-hidden="true"><i data-lucide="key-round" aria-hidden="true">⚿</i></span></span><span class="rf-legend-icon" role="img" aria-label="ARC4 encryption"><span class="rf-key" data-encryption-state="ARC4" aria-hidden="true"><i data-lucide="key-round" aria-hidden="true">⚿</i><b>ARC4</b></span></span><span class="rf-legend-icon" role="img" aria-label="AES encryption"><span class="rf-key" data-encryption-state="AES" aria-hidden="true"><i data-lucide="key-round" aria-hidden="true">⚿</i><b>AES</b></span></span></span>
      </label>
      <label class="rf-legend-row form-check form-switch">
        <input class="form-check-input" type="checkbox" data-toggle="messages">
        <span>Unread messages</span>
        <span class="rf-legend-glyphs"><span class="rf-legend-icon" role="img" aria-label="Unread messages"><i class="rf-envelope" aria-hidden="true"><b></b></i></span></span>
      </label>
      <label class="rf-legend-row form-check form-switch">
        <input class="form-check-input" type="checkbox" data-toggle="record">
        <span>Recording</span>
        <span class="rf-legend-glyphs"><span class="rf-legend-icon" role="img" aria-label="Recording active"><span class="rf-record-mark" aria-hidden="true"><i data-lucide="square" aria-hidden="true">□</i></span></span></span>
      </label>
      <label class="rf-legend-row form-check form-switch">
        <input class="form-check-input" type="checkbox" data-toggle="fix">
        <span>Valid GPS fix</span>
        <span class="rf-legend-glyphs"><span class="rf-legend-icon" role="img" aria-label="Valid GPS fix"><i data-lucide="map-pin" aria-hidden="true">◇</i></span></span>
      </label>
      <label class="rf-legend-row form-check form-switch">
        <input class="form-check-input" type="checkbox" data-toggle="locked">
        <span>Keypad locked</span>
        <span class="rf-legend-glyphs"><span class="rf-legend-icon" role="img" aria-label="Keypad locked"><i data-lucide="lock-keyhole" aria-hidden="true">▣</i></span></span>
      </label>
      <label class="rf-legend-row rf-legend-choice">
        <span>Power level</span>
        <select class="form-select" aria-label="Power level" data-select="power"><option value="L">Low</option><option value="M">Medium</option><option value="H">High</option></select>
        <span class="rf-legend-glyphs"><span class="rf-legend-icon" role="img" aria-label="Low power"><b aria-hidden="true">L</b></span><span class="rf-legend-icon" role="img" aria-label="Medium power"><b aria-hidden="true">M</b></span><span class="rf-legend-icon" role="img" aria-label="High power"><b aria-hidden="true">H</b></span></span>
      </label>
      <label class="rf-legend-row rf-legend-choice">
        <span>Bluetooth</span>
        <select class="form-select" aria-label="Bluetooth" data-select="bluetooth"><option value="off">Off</option><option value="on">On</option><option value="connected">Connected</option></select>
        <span class="rf-legend-glyphs"><span class="rf-legend-icon" role="img" aria-label="Bluetooth on" data-bt-state="on"><i data-lucide="bluetooth" aria-hidden="true">ᛒ</i></span><span class="rf-legend-icon" role="img" aria-label="Bluetooth connected" data-bt-state="connected"><i data-lucide="bluetooth" aria-hidden="true">ᛒ</i></span></span>
      </label>
      <label class="rf-legend-row form-check form-switch">
        <input class="form-check-input" type="checkbox" data-toggle="low-battery">
        <span>Low battery</span>
        <span class="rf-legend-glyphs"><span class="rf-legend-icon" role="img" aria-label="Low battery" data-battery="low"><i class="rf-battery" aria-hidden="true"><b></b><b></b><b></b></i></span></span>
      </label>
    </div>
  </fieldset>
</div>
<style>
  #rf-gd88-profiles [hidden] { display: none !important; }
  #rf-gd88-profiles .rf-preview {
    display: grid;
    justify-items: start;
    padding-block: 12px;
  }
  #rf-gd88-profiles {
    --ink: #172835;
    --symbol-ink: #000;
    --muted: #354e65;
    --bar: #244f88;
    --bar-ink: #fff;
    --accent: #244f88;
    --panel: #dceaf4;
    --status: #f4f8fc;
    --line: #abc3d8;
    --record: #92362f;
    --radio-gray: #69727c;
    --radio-green: #14653b;
    --radio-blue: #1d61a5;
    --radio-red: #bd2929;
    --radio-warning: #876000;
  }
  #rf-gd88-profiles .rf-display {
    --selection: #c2d9ed;
    box-sizing: border-box;
    container-type: inline-size;
    position: relative;
    width: min(100%, 448px);
    /* The 320 × 240 panel has a 10 px right inset in the GD-88 board defaults. */
    aspect-ratio: 310 / 240;
    overflow: hidden;
    background: var(--panel);
    color: var(--ink);
    font-family: system-ui, sans-serif;
  }
  #rf-gd88-profiles[data-color-mode="Night"] {
    --ink: #edf2f7;
    --symbol-ink: #edf2f7;
    --muted: #b4c2d1;
    --bar: #1d3656;
    --bar-ink: #e2ebf4;
    --accent: #98bfe7;
    --panel: #111a24;
    --status: #192634;
    --line: #4a6179;
    --record: #ff9a8d;
    --radio-gray: #a0a8b2;
    --radio-green: #74d899;
    --radio-blue: #82bcff;
    --radio-red: #ff7777;
    --radio-warning: #f5c668;
    --selection: #263d55;
  }
  #rf-gd88-profiles .rf-status,
  #rf-gd88-profiles .rf-keybar {
    position: absolute;
    inset-inline: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-inline: 5cqw;
  }
  #rf-gd88-profiles .rf-status {
    --status-icon-size: 4.5cqw;
    top: 0;
    height: 9.375cqw;
    padding-inline: 1.8cqw;
    font-size: 4.0625cqw;
    font-weight: 650;
    background: var(--status);
    color: var(--symbol-ink);
    box-shadow: inset 0 -1px var(--line);
  }
  #rf-gd88-profiles .rf-status-left {
    display: flex;
    align-items: center;
    gap: 1.05cqw;
    flex: none;
  }
  #rf-gd88-profiles .rf-mode-roaming {
    display: flex;
    align-items: center;
    gap: .4cqw;
  }
  #rf-gd88-profiles .rf-mode-signal {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    width: 7.25cqw;
    justify-items: center;
    gap: .35cqw;
  }
  #rf-gd88-profiles .rf-receive-bars {
    display: flex;
    align-items: end;
    gap: .32cqw;
    width: 4.8cqw;
    height: 2.45cqw;
  }
  #rf-gd88-profiles .rf-receive-bars b {
    flex: 1;
    border-radius: .5px;
    background: currentColor;
    opacity: .3;
  }
  #rf-gd88-profiles .rf-receive-bars b:nth-child(1) { height: 34%; }
  #rf-gd88-profiles .rf-receive-bars b:nth-child(2) { height: 56%; }
  #rf-gd88-profiles .rf-receive-bars b:nth-child(3) { height: 78%; }
  #rf-gd88-profiles .rf-receive-bars b:nth-child(4) { height: 100%; }
  #rf-gd88-profiles .rf-receive-bars b[data-lit] { opacity: 1; }
  #rf-gd88-profiles .rf-status-info {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: .15cqw;
    line-height: 1;
  }
  #rf-gd88-profiles [data-radio-state]:empty,
  #rf-gd88-profiles .rf-status-functions:not(:has([data-feature]:not([hidden]))) {
    display: none;
  }
  #rf-gd88-profiles .rf-status-functions {
    display: flex;
    align-items: center;
    gap: 1.3cqw;
    height: 5.1cqw;
    color: var(--symbol-ink);
    font-size: var(--status-icon-size);
  }
  #rf-gd88-profiles .rf-status-functions > span {
    display: inline-flex;
    align-items: center;
  }
  #rf-gd88-profiles .rf-status-functions > span > i,
  #rf-gd88-profiles .rf-status-functions > span > svg {
    --icon-size: 1em;
    stroke-width: 3;
    font-style: normal;
  }
  #rf-gd88-profiles .rf-dual-lens {
    display: inline-block;
    width: 1.56em;
    height: 1.56em;
    font-size: 12px;
  }
  #rf-gd88-profiles .rf-status-functions .rf-dual-lens { font-size: 3.25cqw; }
  #rf-gd88-profiles .rf-lens-circle {
    position: relative;
    box-sizing: border-box;
    display: grid;
    place-items: center;
    width: 1.38em;
    aspect-ratio: 1;
    border: .135em solid currentColor;
    border-radius: 50%;
  }
  #rf-gd88-profiles .rf-lens-circle::after {
    content: "";
    position: absolute;
    top: 88%;
    left: 88%;
    width: .47em;
    height: .16em;
    border-radius: .09em;
    background: currentColor;
    transform: rotate(45deg);
    transform-origin: left center;
  }
  #rf-gd88-profiles .rf-lens-circle b {
    font: 950 .68em / 1 system-ui, sans-serif;
    letter-spacing: .035em;
    text-indent: .035em;
  }
  #rf-gd88-profiles .rf-status-functions .rf-lens-circle { top: -.1em; }
  #rf-gd88-profiles .rf-status-functions .rf-lens-circle::after { top: 86%; width: .4em; }
  #rf-gd88-profiles .rf-status-functions .rf-lens-circle b { font-size: .69em; }
  #rf-gd88-profiles [data-radio-state] {
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  #rf-gd88-profiles [data-activity-state="tx"],
  #rf-gd88-profiles [data-activity-state="aprs"],
  #rf-gd88-profiles [data-battery="low"] { color: var(--radio-red); }
  #rf-gd88-profiles [data-activity-state="denied"] { color: var(--radio-warning); }
  #rf-gd88-profiles .rf-indicators {
    display: flex;
    align-items: center;
    gap: .35cqw;
    flex: none;
  }
  #rf-gd88-profiles .rf-status-icon,
  #rf-gd88-profiles .rf-legend-icon {
    display: inline-grid;
    place-items: center;
  }
  #rf-gd88-profiles .rf-status-icon {
    width: var(--status-icon-size);
    height: var(--status-icon-size);

<script>
  (() => {
    const root = document.getElementById('rf-gd88-profiles');
    const screens = [...root.querySelectorAll('[data-screen]')];
    const profileChoices = [...root.querySelectorAll('[data-profile]')];
    const modeChoices = [...root.querySelectorAll('[data-mode]')];
    const clockChoices = [...root.querySelectorAll('[data-clock]')];
    const statusToggles = [...root.querySelectorAll('[data-toggle]')];
    const statusChoices = [...root.querySelectorAll('[data-select]')];
    const encryption = root.querySelector('[data-select="encryption"]');
    const power = root.querySelector('[data-select="power"]');
    const bluetooth = root.querySelector('[data-select="bluetooth"]');
    const radioMode = root.querySelector('[data-select="radio-mode"]');
    const signal = root.querySelector('[data-select="signal"]');
    const signalIcon = root.querySelector('.rf-receive-bars');
    const signalBars = [...signalIcon.children];
    const toggles = Object.fromEntries(statusToggles.map(toggle => [toggle.dataset.toggle, toggle]));
    const statusIcons = Object.fromEntries(
      [...root.querySelectorAll('[data-icon]')].map(icon => [icon.dataset.icon, icon])
    );
    const activity = root.querySelector('[data-activity]');
    const featureIndicators = Object.fromEntries(
      [...root.querySelectorAll('[data-feature]')].map(mark => [mark.dataset.feature, mark])
    );
    const transmitLabels = { tx: 'TX', aprs: 'TX APRS', denied: 'NO TX' };
    const caller = root.querySelector('[data-caller]');
    const amateurDetails = root.querySelector('[data-amateur]');
    const dmrDetails = [...root.querySelectorAll('[data-dmr-details]')];
    const currentProfile = root.querySelector('[data-current]');
    const currentMode = root.querySelector('[data-current-mode]');
    const currentClock = root.querySelector('[data-current-clock]');
    const radioState = root.querySelector('[data-radio-state]');
    const homeKeys = [...root.querySelectorAll('[data-home-key]')];
    const back = root.querySelector('[data-back]');
    const parents = {
      menu: 'home', settings: 'menu', display: 'settings', profiles: 'display', 'color-mode': 'display', 'gps-clock': 'display'
    };
    let screen = 'home';
    let profile = 'Commercial';
    let clockEnabled = false;

    function renderHome() {
      amateurDetails.hidden = profile !== 'Amateur';
      caller.hidden = activity.value !== 'alias';
      caller.textContent = caller.hidden ? '' : 'Morgan Reed';
      renderStatus();
    }

    function renderStatus() {
      const showClock = screen === 'home' && activity.value === 'idle' && clockEnabled && toggles.fix.checked;
      radioState.textContent = showClock ? '21 Nov 14:08Z' : transmitLabels[activity.value] ?? '';
      radioState.dataset.activityState = activity.value;
      if (showClock) radioState.setAttribute('aria-label', '21 November, 14:08 UTC');
      else radioState.removeAttribute('aria-label');
      for (const key of ['scan', 'roam', 'talkaround', 'messages', 'fix', 'locked']) {
        statusIcons[key].hidden = !toggles[key].checked;
      }
      for (const state of ['clear', 'arc4', 'aes']) {
        statusIcons[state].hidden = state !== encryption.value;
      }
      statusIcons.power.querySelector('b').textContent = power.value;
      statusIcons.power.setAttribute('aria-label', power.selectedOptions[0].text + ' power');
      statusIcons.bluetooth.hidden = bluetooth.value === 'off';
      statusIcons.bluetooth.dataset.btState = bluetooth.value;
      statusIcons.bluetooth.setAttribute('aria-label', 'Bluetooth ' + bluetooth.value);
      for (const detail of dmrDetails) detail.hidden = radioMode.value !== 'dmr';
      signalIcon.setAttribute('aria-label', 'Signal strength: ' + signal.value + ' of 4 bars');
      signalBars.forEach((bar, index) => bar.toggleAttribute('data-lit', index < Number(signal.value)));
      const activeMode = activity.value === 'aprs' ? 'fm' : radioMode.value;
      for (const option of radioMode.options) {
        statusIcons[option.value].hidden = option.value !== activeMode;
      }
      statusIcons.recording.hidden = !toggles.record.checked;
      const lowBattery = toggles['low-battery'].checked;
      statusIcons.battery.dataset.battery = lowBattery ? 'low' : 'normal';
      statusIcons.battery.setAttribute('aria-label', lowBattery ? 'Low battery' : 'Battery level');

      const monitorLabels = { dmr: 'DMR Digital Monitor', fm: 'FM monitor, squelch open' };
      featureIndicators.monitor.hidden = !toggles.monitor.checked || activity.value === 'aprs';
      featureIndicators.monitor.setAttribute('aria-label', monitorLabels[radioMode.value] ?? 'Monitor active');
      featureIndicators.dual.hidden = !toggles.dual.checked;
      featureIndicators.vox.hidden = !toggles.vox.checked;
      featureIndicators['rx-only'].hidden = !toggles['rx-only'].checked;
    }

    function navigate(next, returnFrom) {
      screen = next;
      renderStatus();
      for (const panel of screens) panel.hidden = panel.dataset.screen !== next;
      for (const key of homeKeys) key.hidden = next !== 'home';
      back.hidden = next === 'home';

      const panel = screens.find(item => item.dataset.screen === next);
      const target = next === 'home' ? homeKeys[0]
        : returnFrom ? panel.querySelector('[data-go="' + returnFrom + '"]')
          : panel.querySelector('[aria-pressed="true"]') ?? panel.querySelector('button');
      target.focus({ preventScroll: true });
    }

    for (const button of root.querySelectorAll('[data-go]')) {
      button.addEventListener('click', () => navigate(button.dataset.go));
    }
    function bindChoices(choices, apply) {
      for (const button of choices) {
        button.addEventListener('click', () => {
          apply(button);
          for (const choice of choices) {
            const active = choice === button;
            choice.setAttribute('aria-pressed', String(active));
            choice.querySelector('span').textContent = active ? '✓' : '';
          }
          navigate('home');
        });
      }
    }

    bindChoices(profileChoices, button => {
      profile = button.dataset.profile;
      currentProfile.textContent = profile;
      renderHome();
    });
    bindChoices(modeChoices, button => {
      root.dataset.colorMode = button.dataset.mode;
      currentMode.textContent = button.dataset.mode;
    });
    bindChoices(clockChoices, button => {
      clockEnabled = button.dataset.clock === 'on';
      currentClock.textContent = clockEnabled ? 'On' : 'Off';
    });
    for (const control of [...statusToggles, ...statusChoices]) control.addEventListener('change', renderStatus);
    back.addEventListener('click', () => navigate(parents[screen], screen));
    activity.addEventListener('change', renderHome);
    renderHome();
  })();
</script>
